name: CI

# main auto-deploys to Vercel on every push, so until this workflow existed
# nothing ran before production. Web, Android and both Apple targets are checked.
# mobile/ stays outside the pnpm workspace and carries its own npm tree.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (test, lint, typecheck)
    runs-on: ubuntu-latest
    env:
      # prisma generate runs as a postinstall hook and wants the datasource URL
      # to be parseable. It never connects, so a placeholder is enough.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Logic tests
        run: pnpm test:logic

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  mobile:
    name: mobile (typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  apple:
    name: Apple (compile and unit tests)
    runs-on: macos-26
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen
      - name: macOS tests
        run: xcodebuild test -project SureWord.xcodeproj -scheme SureWord -destination 'platform=macOS' -derivedDataPath build-ci-mac.noindex CODE_SIGNING_ALLOWED=NO
      - name: iOS tests
        shell: bash
        run: |
          simulator_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          xcodebuild test -project SureWord.xcodeproj -scheme SureWord-iOS -destination "platform=iOS Simulator,id=$simulator_id" -derivedDataPath build-ci-ios.noindex CODE_SIGNING_ALLOWED=NO
