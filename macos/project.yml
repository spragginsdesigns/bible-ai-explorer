# XcodeGen spec for the SureWord macOS client.
#
# The .xcodeproj is generated, never committed: across the four build phases this
# file gains dozens of Swift files, and a hand-maintained .pbxproj is merge-hostile
# for no benefit. Run `xcodegen` after pulling, or after adding a new folder.
name: SureWord

options:
  bundleIdPrefix: com.spragginsdesigns
  deploymentTarget:
    macOS: "15.0"
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.13.0"
    CURRENT_PROJECT_VERSION: "15"
    # Signed manually with the local Apple Development identity.
    #
    # Ad-hoc ("-") does NOT work here: a keychain access group is only honored
    # when the signature carries a team, so the data-protection keychain fails
    # every query with OSStatus -34018 (errSecMissingEntitlement) and sign-in
    # dies. Automatic signing is no good either — it demands a "Mac Development"
    # certificate and provisioning profile that need a paid membership.
    #
    # DEVELOPMENT_TEAM is the certificate's *OU*, not the id in its common name:
    #   security find-certificate -c "Apple Development: Austin Spraggins" -p \
    #     | openssl x509 -noout -subject
    #   → UID=…, CN=Apple Development: … (Q79QD7L78T), OU=389LLKGY3Y
    # Q79QD7L78T is the certificate id and is the wrong value.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: 389LLKGY3Y
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  Clerk:
    url: https://github.com/clerk/clerk-ios
    from: "1.2.0"

targets:
  SureWord:
    type: application
    platform: macOS
    sources:
      - path: SureWord
      - path: Shared
    dependencies:
      - package: Clerk
        product: ClerkKit
      - package: Clerk
        product: ClerkKitUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spragginsdesigns.sureword
        PRODUCT_NAME: SureWord
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: SureWord/Info.plist
      properties:
        CFBundleDisplayName: SureWord
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Brand fonts (Resources/Fonts) are copied flat into Contents/Resources,
        # so the font scan path is the Resources root itself.
        ATSApplicationFontsPath: "."
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.reference
        NSHumanReadableCopyright: "© 2026 Austin Spraggins"
        # HTTPS (URLSession/TLS) is the only encryption, which is exempt: no
        # export-compliance documentation needed in App Store Connect (PRD A6).
        ITSAppUsesNonExemptEncryption: false
        # Clerk's OAuth flow returns to the app through this scheme. It must stay
        # in sync with the Clerk dashboard's redirect allowlist — `sureword://`
        # entries are already registered there for the Android client.
        CFBundleURLTypes:
          - CFBundleURLName: com.spragginsdesigns.sureword
            CFBundleURLSchemes: [sureword]
    # No entitlements file, and specifically NO App Sandbox.
    #
    # The sandbox is a Mac App Store requirement, and nothing here is distributed
    # that way. Enabling it costs an outage and buys nothing: a sandboxed app
    # signed with a Development certificate and no embedded provisioning profile
    # hangs in `_libsecinit_appsandbox` before `main()` ever runs — the process
    # shows up in `ps` with no window and no error anywhere. A provisioning
    # profile requires a paid Apple Developer Program membership.
    #
    # To turn it back on later: enrol in the program, then sign with a profile
    # carrying `com.apple.security.app-sandbox`, `network.client`, and
    # `files.user-selected.read-only` (needed for chat file attachments).

  SureWordTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SureWordTests
    dependencies:
      - target: SureWord
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spragginsdesigns.sureword.tests
        GENERATE_INFOPLIST_FILE: YES

  # iOS client. Shares everything under Shared/ with the macOS target — same
  # module layout, so no import changes either side. Only the shell
  # (SureWord-iOS/) is platform-specific; later lanes build the real UI there.
  SureWord-iOS:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: SureWord-iOS
      # The share-extension inbox, compiled into both sides of the hand-off.
      - path: ShareInbox
    dependencies:
      - package: Clerk
        product: ClerkKit
      - package: Clerk
        product: ClerkKitUI
      # "Share into SureWord" (PRD D8), embedded in PlugIns/.
      - target: SureWord-iOS-Share
    # The App Group is the share extension's only channel to the app: it
    # writes the share into the group container and the app reads it back
    # (`ShareInbox/PendingShareStore.swift`). The same group is declared by
    # the extension. Simulator builds honour it as is; device and App Store
    # signing need `group.com.spragginsdesigns.sureword` registered in the
    # developer portal and on both App IDs' provisioning profiles.
    #
    # `aps-environment` is remote push (PRD B6, `PushRegistration.swift`). The
    # value follows the configuration: Debug talks to the APNs sandbox,
    # Release (TestFlight and the App Store, whose profile carries
    # `production`) to production. `PushRegistration` tells Expo the same.
    entitlements:
      path: SureWord-iOS/SureWord-iOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.spragginsdesigns.sureword
        # Sign in with Apple (PRD A2, App Review 4.8 because Google is
        # offered). ClerkKitUI's AuthView shows "Continue with Apple" on its
        # own once the Clerk production instance enables the Apple
        # connection; the App ID has the capability (ASC, 2026-10-07).
        com.apple.developer.applesignin:
          - Default
        aps-environment: $(SUREWORD_APS_ENVIRONMENT)
    settings:
      configs:
        Debug:
          SUREWORD_APS_ENVIRONMENT: development
        Release:
          SUREWORD_APS_ENVIRONMENT: production
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spragginsdesigns.sureword
        PRODUCT_NAME: SureWord
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
        # Single 1024 master in SureWord-iOS/Assets.xcassets — the same
        # full-bleed artwork as mobile/assets/icon.png (the brand master).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: SureWord-iOS/Info.plist
      properties:
        CFBundleDisplayName: SureWord
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.reference
        NSHumanReadableCopyright: "© 2026 Austin Spraggins"
        # HTTPS (URLSession/TLS) is the only encryption, which is exempt: no
        # export-compliance documentation needed in App Store Connect (PRD A6).
        ITSAppUsesNonExemptEncryption: false
        # Listen (the spoken devotional) keeps playing with the screen locked;
        # without this iOS suspends the audio session on lock and the Now
        # Playing / remote-command work in ListenModel is inert.
        UIBackgroundModes: [audio]
        # Same OAuth return scheme as the other clients — see the SureWord
        # target's note and the Clerk dashboard's redirect allowlist.
        CFBundleURLTypes:
          - CFBundleURLName: com.spragginsdesigns.sureword
            CFBundleURLSchemes: [sureword]
        # Strings match mobile/app.json's expo-image-picker plugin config.
        NSCameraUsageDescription: "Allow SureWord to take photos for your AI conversations."
        NSPhotoLibraryUsageDescription: "Allow SureWord to attach photos to your AI conversations."
        # Brand fonts from Shared/Resources/Fonts, copied flat into the bundle.
        UIAppFonts:
          - PirataOne-Regular.ttf
          - CormorantGaramond-Medium.ttf
          - CormorantGaramond-MediumItalic.ttf
        # No launch storyboard — SwiftUI builds the launch screen from this.
        UILaunchScreen: {}
        # App Store validation rejects an iPad-capable bundle without these
        # (iPad multitasking needs all four). iPhone skips upside-down, as
        # Apple's own apps do.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  # "Share into SureWord" (PRD D8): an iOS Share Extension for text, links,
  # photos, PDFs and audio (voice messages from Voice Memos, Messages,
  # Discord, Files). It only copies what was shared into the App Group inbox
  # and hands off; no Clerk, no network, no validation - the app decides what
  # can be attached, with the same rules as the + button. See
  # `SureWord-iOS-Share/ShareViewController.swift` for the hand-off.
  SureWord-iOS-Share:
    type: app-extension
    platform: iOS
    sources:
      - path: SureWord-iOS-Share
      - path: ShareInbox
    settings:
      base:
        # Must stay a child of the app's id; not yet registered as an App ID,
        # which only blocks device/App Store signing, not the simulator.
        PRODUCT_BUNDLE_IDENTIFIER: com.spragginsdesigns.sureword.share
        PRODUCT_NAME: SureWordShare
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    entitlements:
      path: SureWord-iOS-Share/SureWord-iOS-Share.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.spragginsdesigns.sureword
    info:
      path: SureWord-iOS-Share/Info.plist
      properties:
        CFBundleDisplayName: SureWord
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: "© 2026 Austin Spraggins"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # The dictionary form, not a predicate: a Discord or WhatsApp
            # voice note is often an .ogg/.opus with only a dynamic type, which
            # no UTI predicate on public.audio would match, but which is still
            # a file. Counts mirror the 5-files-per-message limit; anything the
            # server would refuse is explained in the chat, as on Android.
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 5
              NSExtensionActivationSupportsFileWithMaxCount: 5
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 5

  SureWord-iOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SureWord-iOSTests
    dependencies:
      - target: SureWord-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spragginsdesigns.sureword.ios-tests
        GENERATE_INFOPLIST_FILE: YES
        # The app target is named SureWord-iOS but its PRODUCT_NAME is SureWord,
        # so the default $(TARGET_NAME)-based host path misses the real binary.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SureWord.app/SureWord"
        BUNDLE_LOADER: "$(TEST_HOST)"

  # Drives the real system share sheet in Safari, Photos and Files into the
  # extension (PRD D8 evidence). Its own scheme, outside the SureWord-iOS test
  # gate, because it needs media staged on the simulator first; see the file.
  SureWord-iOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SureWord-iOSUITests
    dependencies:
      - target: SureWord-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spragginsdesigns.sureword.ios-uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SureWord-iOS

schemes:
  SureWord:
    build:
      targets:
        SureWord: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SureWordTests
  SureWord-iOS:
    build:
      targets:
        SureWord-iOS: all
    run:
      config: Debug
      # Local StoreKit testing in the simulator (SureWord Pro, $14.99/month).
      # Xcode-signed transactions; production servers reject them by design.
      storeKitConfiguration: StoreKit/SureWord.storekit
    test:
      config: Debug
      targets:
        - SureWord-iOSTests
  SureWord-iOS-ShareUITests:
    build:
      targets:
        SureWord-iOS: all
        SureWord-iOSUITests: [test]
    test:
      config: Debug
      targets:
        - SureWord-iOSUITests
