# XcodeGen spec for the SureWord macOS client.
#
# The .xcodeproj is generated, never committed: across the four build phases this
# file gains dozens of Swift files, and a hand-maintained .pbxproj is merge-hostile
# for no benefit. Run `xcodegen` after pulling, or after adding a new folder.
name: SureWord

options:
  bundleIdPrefix: com.spragginsdesigns
  deploymentTarget:
    macOS: "15.0"
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.30.0"
    CURRENT_PROJECT_VERSION: "39"
    # Signed manually with the local Apple Development identity.
    #
    # Ad-hoc ("-") does NOT work here: a keychain access group is only honored
    # when the signature carries a team, so the data-protection keychain fails
    # every query with OSStatus -34018 (errSecMissingEntitlement) and sign-in
    # dies. Automatic signing is no good either — it demands a "Mac Development"
    # certificate and provisioning profile that need a paid membership.
    #
    # DEVELOPMENT_TEAM is the certificate's *OU*, not the id in its common name:
    #   security find-certificate -c "Apple Development: Austin Spraggins" -p \
    #     | openssl x509 -noout -subject
    #   → UID=…, CN=Apple Development: … (Q79QD7L78T), OU=389LLKGY3Y
    # Q79QD7L78T is the certificate id and is the wrong value.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: 389LLKGY3Y
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  Clerk:
    url: https://github.com/clerk/clerk-ios
    from: "1.2.0"

targets:
  SureWord:
    type: application
    platform: macOS
    sources:
      - path: SureWord
      - path: Shared
        # The Spanish, German and ASV Bibles all name their books 01.json ...
        # 66.json, so they cannot join the flat copy the rest of Bible/Data/
        # gets. They ship as folder references instead (Resources/rv1909/,
        # Resources/lut1912/, Resources/asv/), read by `BundledBibleLibrary`.
        excludes:
          - "Atlas/AtlasData"
          - "Atlas/AtlasData/**"
          - "Bible/Data/rv1909"
          - "Bible/Data/rv1909/**"
          - "Bible/Data/lut1912"
          - "Bible/Data/lut1912/**"
          - "Bible/Data/asv"
          - "Bible/Data/asv/**"
      - path: Shared/Atlas/AtlasData
        type: folder
        buildPhase: resources
      - path: Shared/Bible/Data/rv1909
        type: folder
        buildPhase: resources
      - path: Shared/Bible/Data/lut1912
        type: folder
        buildPhase: resources
      - path: Shared/Bible/Data/asv
        type: folder
        buildPhase: resources
      # "Share into SureWord": the Services menu entry and drops on the window
      # or Dock icon write the same inbox the iOS share extension does
      # (`SureWord/App/MacShareInbox.swift`), under Application Support.
      - path: ShareInbox
      - path: SureWord-iOS/App/PushDelivery.swift
    dependencies:
      - package: Clerk
        product: ClerkKit
      - package: Clerk
        product: ClerkKitUI
      # "SureWord" in other apps' Share menus, embedded in PlugIns/.
      - target: SureWord-macOS-Share
    settings:
      configs:
        Debug:
          SUREWORD_APS_ENVIRONMENT: development
          CODE_SIGN_ENTITLEMENTS: "$(SUREWORD_MAC_ENTITLEMENTS)"
        Release:
          SUREWORD_APS_ENVIRONMENT: production
          CODE_SIGN_ENTITLEMENTS: "$(SUREWORD_MAC_ENTITLEMENTS)"
          CODE_SIGN_IDENTITY: "Developer ID Application"
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          OTHER_CODE_SIGN_FLAGS: "$(inherited) --timestamp"
          SUREWORD_MAC_ENTITLEMENTS: SureWord/SureWordPush.entitlements
          SUREWORD_MAC_PUSH_PROFILE: "SureWord com.spragginsdesigns.sureword Developer ID Push"
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spragginsdesigns.sureword
        PRODUCT_NAME: SureWord
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        SUREWORD_MAC_ENTITLEMENTS: SureWord/SureWord.entitlements
        SUREWORD_MAC_PUSH_PROFILE: ""
        PROVISIONING_PROFILE_SPECIFIER: "$(SUREWORD_MAC_PUSH_PROFILE)"
        # Release uses the matching Developer ID Push profile above. Debug
        # retains the local notification path without a provisioning profile.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: SureWord/Info.plist
      properties:
        CFBundleDisplayName: SureWord
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Brand fonts (Resources/Fonts) are copied flat into Contents/Resources,
        # so the font scan path is the Resources root itself.
        ATSApplicationFontsPath: "."
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.reference
        NSHumanReadableCopyright: "© 2026 Austin Spraggins"
        # HTTPS (URLSession/TLS) is the only encryption, which is exempt: no
        # export-compliance documentation needed in App Store Connect (PRD A6).
        ITSAppUsesNonExemptEncryption: false
        # Clerk's OAuth flow returns to the app through this scheme. It must stay
        # in sync with the Clerk dashboard's redirect allowlist — `sureword://`
        # entries are already registered there for the Android client.
        CFBundleURLTypes:
          - CFBundleURLName: com.spragginsdesigns.sureword
            CFBundleURLSchemes: [sureword]
        # "Add to Apple Calendar" on a church event (sermon studies). macOS has
        # no EventKitUI, so the app asks for write-only access and saves the
        # event itself; without this string the request is refused.
        NSCalendarsWriteOnlyAccessUsageDescription: "Allow SureWord to add events announced at your church to your calendar."
        # "Share into SureWord" in other apps' Services menus: the selected
        # text, or the files selected in Finder (images, PDFs, audio, text, the
        # kinds Android's share target takes). AppKit sends
        # `shareIntoSureWord:userData:error:` to the app delegate
        # (`MacShareInbox.swift`). NSRequiredContext must be present (empty:
        # no filtering), or the system registers the service but does not put
        # it in the Services menu. A new or changed entry is picked up at the
        # next login, or at once with `/System/Library/CoreServices/pbs -update`.
        NSServices:
          - NSMenuItem:
              default: Share into SureWord
            NSMessage: shareIntoSureWord
            NSPortName: SureWord
            NSRequiredContext: {}
            NSSendTypes:
              - public.utf8-plain-text
            NSSendFileTypes:
              - public.image
              - public.audio
              - com.adobe.pdf
              - public.text
        # The same kinds dropped on the Dock icon. Rank None: SureWord accepts
        # the drop (it arrives through `onOpenURL` as a file URL) but is never
        # chosen to open these files.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Shared into SureWord
            CFBundleTypeRole: Viewer
            LSHandlerRank: None
            LSItemContentTypes:
              - public.image
              - public.audio
              - com.adobe.pdf
              - public.text
    # Hardened Runtime resource access only, and specifically NO App Sandbox.
    # The Hardened Runtime refuses calendar access to an app that lacks this
    # entitlement, whatever the person answers; it needs no provisioning
    # profile.
    #
    # The App Group, which an unsandboxed app may carry too, is how the Share
    # extension hands a share over (`ShareInbox/PendingShareStore.swift`). It
    # is the Mac's Team-ID-prefixed form, which macOS authorizes from the
    # signature's team alone, so it needs no provisioning profile and no
    # portal registration; the iOS `group.` form would need both on the Mac.
    # The host's two entitlement files are maintained as sources. XcodeGen's
    # entitlements generator overwrites CODE_SIGN_ENTITLEMENTS, preventing the
    # target-specific push selection above from taking effect.
    #
    # The sandbox is a Mac App Store requirement, and nothing here is distributed
    # that way. Enabling it costs an outage and buys nothing: a sandboxed app
    # signed with a Development certificate and no embedded provisioning profile
    # hangs in `_libsecinit_appsandbox` before `main()` ever runs — the process
    # shows up in `ps` with no window and no error anywhere. A provisioning
    # profile requires a paid Apple Developer Program membership.
    #
    # To turn it back on later: enrol in the program, then sign with a profile
    # carrying `com.apple.security.app-sandbox`, `network.client`, and
    # `files.user-selected.read-only` (needed for chat file attachments).

  SureWordTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SureWordTests
      # Pure Shared/ logic behind the Mac note menu's Copy and Share as
      # Markdown; it reads its fixtures by #filePath, so no resources needed.
      - path: SureWord-iOSTests/NoteMarkdownExportTests.swift
      # Pure Shared/ logic the Mac reader's verse sheet now draws too: the
      # selection rules, the sheet model and the See also decoder.
      - path: SureWord-iOSTests/VerseSelectionTests.swift
      - path: SureWord-iOSTests/BibleTextTests.swift
      # Learn a verse, which the Mac now shows too: the card and mode
      # decoders, the masking ladder, the practice modes and the review sync.
      - path: SureWord-iOSTests/LearnContractTests.swift
      - path: SureWord-iOSTests/LearnPracticeTests.swift
      - path: SureWord-iOSTests/LearnSyncTests.swift
      # What's new, which the Mac shows too: filter, dates, months, targets
      # and the tolerant decoders.
      - path: SureWord-iOSTests/WhatsNewTests.swift
      # Quiz me, which the Mac shows too: the contract mirror, the decoders
      # and the pure rules behind both apps' quiz screens.
      - path: SureWord-iOSTests/QuizTests.swift
      # Walk with me, which the Mac runs too: the rules mirror, the card and
      # tool part parsing, the voice queue rules and the text size mapping.
      - path: SureWord-iOSTests/OnboardingTests.swift
      # Spanish and German: the bundled Bibles, their book names, the answer
      # language and the requests that carry it.
      - path: SureWord-iOSTests/LanguagesTests.swift
    dependencies:
      - target: SureWord
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spragginsdesigns.sureword.tests
        GENERATE_INFOPLIST_FILE: YES

  # "SureWord" in the Mac's Share menu (Safari, Photos, Voice Memos, Finder,
  # Notes): the iOS share extension's Mac twin. Same collector, caps and
  # inbox (`ShareInbox/`), written to the Mac's App Group container; the app
  # takes it into the same chat intake as the Services menu and drops
  # (`SureWord/App/MacShareInbox.swift`).
  SureWord-macOS-Share:
    type: app-extension
    platform: macOS
    sources:
      - path: SureWord-macOS-Share
      - path: ShareInbox
      # The app's attachment caps (`ShareInbox/PendingShareCopy.swift`), as
      # in the iOS extension. Foundation and UniformTypeIdentifiers only.
      - path: Shared/Chat/FileAttachments.swift
    settings:
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          OTHER_CODE_SIGN_FLAGS: "$(inherited) --timestamp"
      base:
        # The iOS extension's id: the Mac app already shares the iOS app's.
        PRODUCT_BUNDLE_IDENTIFIER: com.spragginsdesigns.sureword.share
        PRODUCT_NAME: SureWordShare
        APPLICATION_EXTENSION_API_ONLY: YES
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
    # macOS loads only sandboxed app extensions. The sandbox plus a
    # Team-ID-prefixed group runs signed with the Development certificate
    # and no provisioning profile (checked on this Mac, 2026-10-28); the
    # container the extension writes is the one the app reads.
    entitlements:
      path: SureWord-macOS-Share/SureWord-macOS-Share.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - 389LLKGY3Y.group.com.spragginsdesigns.sureword
    info:
      path: SureWord-macOS-Share/Info.plist
      properties:
        CFBundleDisplayName: SureWord
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "© 2026 Austin Spraggins"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # The iOS extension's rule, for the same reason: a voice note with
            # only a dynamic type is still a file.
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 5
              NSExtensionActivationSupportsFileWithMaxCount: 5
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 5

  # iOS client. Shares everything under Shared/ with the macOS target — same
  # module layout, so no import changes either side. Only the shell
  # (SureWord-iOS/) is platform-specific; later lanes build the real UI there.
  SureWord-iOS:
    type: application
    platform: iOS
    sources:
      - path: Shared
        # The Spanish, German and ASV Bibles all name their books 01.json ...
        # 66.json, so they cannot join the flat copy the rest of Bible/Data/
        # gets. They ship as folder references instead (Resources/rv1909/,
        # Resources/lut1912/, Resources/asv/), read by `BundledBibleLibrary`.
        excludes:
          - "Atlas/AtlasData"
          - "Atlas/AtlasData/**"
          - "Bible/Data/rv1909"
          - "Bible/Data/rv1909/**"
          - "Bible/Data/lut1912"
          - "Bible/Data/lut1912/**"
          - "Bible/Data/asv"
          - "Bible/Data/asv/**"
      - path: Shared/Atlas/AtlasData
        type: folder
        buildPhase: resources
      - path: Shared/Bible/Data/rv1909
        type: folder
        buildPhase: resources
      - path: Shared/Bible/Data/lut1912
        type: folder
        buildPhase: resources
      - path: Shared/Bible/Data/asv
        type: folder
        buildPhase: resources
      - path: SureWord-iOS
      # The share-extension inbox, compiled into both sides of the hand-off.
      - path: ShareInbox
    dependencies:
      - package: Clerk
        product: ClerkKit
      - package: Clerk
        product: ClerkKitUI
      # "Share into SureWord" (PRD D8), embedded in PlugIns/.
      - target: SureWord-iOS-Share
      # Notification art: the thumbnail on a closed banner, and the
      # long-press view (Shared/NotificationArt, docs/FEATURES.md).
      - target: SureWord-iOS-NotificationService
      - target: SureWord-iOS-NotificationContent
    # The App Group is the share extension's only channel to the app: it
    # writes the share into the group container and the app reads it back
    # (`ShareInbox/PendingShareStore.swift`). The same group is declared by
    # the extension. Simulator builds honour it as is; device and App Store
    # signing need `group.com.spragginsdesigns.sureword` registered in the
    # developer portal and on both App IDs' provisioning profiles.
    #
    # `aps-environment` is remote push (PRD B6, `PushRegistration.swift`). The
    # value follows the configuration: Debug talks to the APNs sandbox,
    # Release (TestFlight and the App Store, whose profile carries
    # `production`) to production. `PushRegistration` tells Expo the same.
    entitlements:
      path: SureWord-iOS/SureWord-iOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.spragginsdesigns.sureword
        # Sign in with Apple (PRD A2, App Review 4.8 because Google is
        # offered). ClerkKitUI's AuthView shows "Continue with Apple" on its
        # own once the Clerk production instance enables the Apple
        # connection; the App ID has the capability (ASC, 2026-10-07).
        com.apple.developer.applesignin:
          - Default
        aps-environment: $(SUREWORD_APS_ENVIRONMENT)
    settings:
      configs:
        Debug:
          SUREWORD_APS_ENVIRONMENT: development
        Release:
          SUREWORD_APS_ENVIRONMENT: production
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spragginsdesigns.sureword
        PRODUCT_NAME: SureWord
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
        # Single 1024 master in SureWord-iOS/Assets.xcassets — the same
        # full-bleed artwork as mobile/assets/icon.png (the brand master).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: SureWord-iOS/Info.plist
      properties:
        # Readable on iOS without private entitlement APIs; the same setting
        # also signs aps-environment above.
        SureWordAPNsEnvironment: $(SUREWORD_APS_ENVIRONMENT)
        CFBundleDisplayName: SureWord
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.reference
        NSHumanReadableCopyright: "© 2026 Austin Spraggins"
        # HTTPS (URLSession/TLS) is the only encryption, which is exempt: no
        # export-compliance documentation needed in App Store Connect (PRD A6).
        ITSAppUsesNonExemptEncryption: false
        # Listen (the spoken devotional) keeps playing with the screen locked;
        # without this iOS suspends the audio session on lock and the Now
        # Playing / remote-command work in ListenModel is inert.
        UIBackgroundModes: [audio]
        # Same OAuth return scheme as the other clients — see the SureWord
        # target's note and the Clerk dashboard's redirect allowlist.
        CFBundleURLTypes:
          - CFBundleURLName: com.spragginsdesigns.sureword
            CFBundleURLSchemes: [sureword]
        # Strings match mobile/app.json's expo-image-picker plugin config.
        NSCameraUsageDescription: "Allow SureWord to take photos for your AI conversations."
        NSPhotoLibraryUsageDescription: "Allow SureWord to attach photos to your AI conversations."
        # Brand fonts from Shared/Resources/Fonts, copied flat into the bundle.
        UIAppFonts:
          - PirataOne-Regular.ttf
          - CormorantGaramond-Medium.ttf
          - CormorantGaramond-MediumItalic.ttf
        # No launch storyboard — SwiftUI builds the launch screen from this.
        UILaunchScreen:
          UIColorName: SureWordLaunchBackground
        # App Store validation rejects an iPad-capable bundle without these
        # (iPad multitasking needs all four). iPhone skips upside-down, as
        # Apple's own apps do.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  # "Share into SureWord" (PRD D8): an iOS Share Extension for text, links,
  # photos, PDFs and audio (voice messages from Voice Memos, Messages,
  # Discord, Files). It only copies what was shared into the App Group inbox
  # and hands off; no Clerk, no network, no validation - the app decides what
  # can be attached, with the same rules as the + button. See
  # `SureWord-iOS-Share/ShareViewController.swift` for the hand-off.
  SureWord-iOS-Share:
    type: app-extension
    platform: iOS
    sources:
      - path: SureWord-iOS-Share
      - path: ShareInbox
      # The app's attachment caps, so the extension copies under the same
      # per-type limits (`ShareInbox/PendingShareCopy.swift`). Foundation and
      # UniformTypeIdentifiers only, so it is extension-safe.
      - path: Shared/Chat/FileAttachments.swift
    settings:
      base:
        # Must stay a child of the app's id; not yet registered as an App ID,
        # which only blocks device/App Store signing, not the simulator.
        PRODUCT_BUNDLE_IDENTIFIER: com.spragginsdesigns.sureword.share
        PRODUCT_NAME: SureWordShare
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    entitlements:
      path: SureWord-iOS-Share/SureWord-iOS-Share.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.spragginsdesigns.sureword
    info:
      path: SureWord-iOS-Share/Info.plist
      properties:
        CFBundleDisplayName: SureWord
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: "© 2026 Austin Spraggins"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # The dictionary form, not a predicate: a Discord or WhatsApp
            # voice note is often an .ogg/.opus with only a dynamic type, which
            # no UTI predicate on public.audio would match, but which is still
            # a file. Counts mirror the 5-files-per-message limit; anything the
            # server would refuse is explained in the chat, as on Android.
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 5
              NSExtensionActivationSupportsFileWithMaxCount: 5
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 5

  # Attaches each push's art (Shared/NotificationArt) as its banner
  # thumbnail. Woken by the `mutable-content` the server sets on the Daily
  # Cross and answer pushes (src/lib/apns.ts). No network, no App Group: the
  # art is bundled.
  SureWord-iOS-NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: SureWord-iOS-NotificationService
      - path: Shared/NotificationArt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spragginsdesigns.sureword.notification-service
        PRODUCT_NAME: SureWordNotificationService
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: SureWord-iOS-NotificationService/Info.plist
      properties:
        CFBundleDisplayName: SureWord
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: "© 2026 Austin Spraggins"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService

  # The long-press view: the kind's wide art over its title and text
  # (Apple's "Customizing the Appearance of Notifications"). Picked by the
  # category the server sends; Apple keeps the header.
  SureWord-iOS-NotificationContent:
    type: app-extension
    platform: iOS
    sources:
      - path: SureWord-iOS-NotificationContent
      - path: Shared/NotificationArt
    dependencies:
      - sdk: UserNotificationsUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spragginsdesigns.sureword.notification-content
        PRODUCT_NAME: SureWordNotificationContent
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: SureWord-iOS-NotificationContent/Info.plist
      properties:
        CFBundleDisplayName: SureWord
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: "© 2026 Austin Spraggins"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.content-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationViewController
          NSExtensionAttributes:
            UNNotificationExtensionCategory: [SUREWORD_CROSS, SUREWORD_ANSWER]
            # The controller sets preferredContentSize from its content; this
            # is only the first frame's height-to-width ratio.
            UNNotificationExtensionInitialContentSizeRatio: 0.9
            UNNotificationExtensionDefaultContentHidden: true

  SureWord-iOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SureWord-iOSTests
      # Pure Shared/ logic, so the macOS suite runs on iOS unchanged.
      - path: SureWordTests/VersePassagesTests.swift
      - path: SureWordTests/ShareCardsTests.swift
      # The note mutation protocol and byte-stream lifecycle are shared by
      # both apps; run them on the signed simulator test host as well.
      - path: SureWordTests/NoteAPITests.swift
      - path: SureWordTests/NoteAIStreamTests.swift
      - path: SureWordTests/NoteAIIntegrityTests.swift
      - path: SureWordTests/StreamFramingTests.swift
      - path: SureWordTests/UIMessageStreamTests.swift
    dependencies:
      - target: SureWord-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spragginsdesigns.sureword.ios-tests
        GENERATE_INFOPLIST_FILE: YES
        # The app target is named SureWord-iOS but its PRODUCT_NAME is SureWord,
        # so the default $(TARGET_NAME)-based host path misses the real binary.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SureWord.app/SureWord"
        BUNDLE_LOADER: "$(TEST_HOST)"

  # Drives the real system share sheet in Safari, Photos and Files into the
  # extension (PRD D8 evidence). Its own scheme, outside the SureWord-iOS test
  # gate, because it needs media staged on the simulator first; see the file.
  SureWord-iOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SureWord-iOSUITests
    dependencies:
      - target: SureWord-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spragginsdesigns.sureword.ios-uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SureWord-iOS

schemes:
  SureWord:
    build:
      targets:
        SureWord: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SureWordTests
  SureWord-iOS:
    build:
      targets:
        SureWord-iOS: all
    run:
      config: Debug
      # Local StoreKit testing in the simulator (SureWord Pro, $14.99/month).
      # Xcode-signed transactions; production servers reject them by design.
      storeKitConfiguration: StoreKit/SureWord.storekit
